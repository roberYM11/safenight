name: Validate SafeNight

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/safenight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/safenight/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SAFENIGHT_TEST_DATABASE_URL: postgresql+psycopg://safenight_ci:ci-test-only@127.0.0.1:5432/safenight_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          python-version: '3.12'
      - name: Start native PostgreSQL for integration tests
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql --set ON_ERROR_STOP=1 --command "CREATE ROLE safenight_ci LOGIN PASSWORD 'ci-test-only';"
          sudo -u postgres psql --set ON_ERROR_STOP=1 --command "CREATE DATABASE safenight_test OWNER safenight_ci;"
          pg_isready -h 127.0.0.1 -p 5432
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run basedpyright
      - run: uv run pytest -q

  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          python-version: '3.12'
      - run: uv sync --locked
        working-directory: backend
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Verify frozen D1 data through Python fitting and Worker model promotion
        run: node --test tests/pipeline.test.mjs
        env:
          SAFENIGHT_PIPELINE_PYTHON_QA: '1'
