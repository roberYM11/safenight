name: Collect Seoul area population
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safenight-population
  cancel-in-progress: false
jobs:
  collect:
    if: vars.SAFENIGHT_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Collect published area aggregates
        env:
          SAFENIGHT_COLLECT_AUTH_TOKEN: ${{ secrets.SAFENIGHT_COLLECT_AUTH_TOKEN }}
          SAFENIGHT_SITE_BYPASS_TOKEN: ${{ secrets.SAFENIGHT_SITE_BYPASS_TOKEN }}
        run: node scripts/pipeline-client.mjs population
