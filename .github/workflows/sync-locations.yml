name: Check Seoul sensor location workbook

on:
  schedule:
    - cron: '45 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safenight-location-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.SAFENIGHT_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          python-version: '3.12'
      - run: uv sync --locked --no-dev
        working-directory: backend
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: cloud
      - run: node scripts/sync-locations.mjs
        working-directory: cloud
        env:
          SAFENIGHT_COLLECT_AUTH_TOKEN: ${{ secrets.SAFENIGHT_COLLECT_AUTH_TOKEN }}
          SAFENIGHT_SITE_BYPASS_TOKEN: ${{ secrets.SAFENIGHT_SITE_BYPASS_TOKEN }}
