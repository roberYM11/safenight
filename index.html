
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>SafeNight [BETA] - 야간 안심 귀가</title>
    <meta name="theme-color" content="#111827" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              night: {
                900: '#111827',
                800: '#1F2937',
                700: '#374151',
                accent: '#667eea',
                safe: '#10B981',   // Green
                caution: '#F59E0B', // Yellow
                danger: '#EF4444',  // Red
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #111827;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .leaflet-container { background: #111827; z-index: 0; }
      
      /* 마커 페이드 UX 구현을 위한 스타일 */
      .leaflet-marker-pane, .leaflet-popup-pane, .leaflet-overlay-pane {
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        opacity: 1;
      }
      .map-is-moving .leaflet-marker-pane,
      .map-is-moving .leaflet-popup-pane,
      .map-is-moving .leaflet-overlay-pane {
        opacity: 0 !important;
        transition: opacity 0.1s ease-out;
        pointer-events: none;
      }

      /* 사용자 마커 전용 로테이션 스타일 */
      .user-marker-heading-container {
        transform: rotate(var(--user-heading, 0deg));
        transition: transform 0.3s ease-out;
      }

      body.dark .leaflet-popup-content-wrapper,
      body.dark .leaflet-popup-tip {
        background: #1f2937 !important;
        color: white !important;
      }
      body.light .leaflet-popup-content-wrapper,
      body.light .leaflet-popup-tip {
        background: white !important;
        color: #111827 !important;
      }
      
      #root { position: relative; z-index: 1; height: 100%; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.2.0?deps=react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.2.0,react-dom@18.2.0",
    "@remix-run/router": "https://esm.sh/@remix-run/router@1.15.3",
    "leaflet": "https://esm.sh/leaflet@1.9.4",
    "react-leaflet": "https://esm.sh/react-leaflet@4.2.1?deps=react@18.2.0,react-dom@18.2.0,leaflet@1.9.4",
    "papaparse": "https://esm.sh/papaparse@5.4.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="dark">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
