name: safenight

x-app: &app
  image: safenight-local:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    SAFENIGHT_DATABASE_URL: postgresql+asyncpg://safenight:${SAFENIGHT_DB_PASSWORD:?Use scripts/docker-local.sh or set SAFENIGHT_DB_PASSWORD}@db:5432/safenight
    SAFENIGHT_MODEL_BUNDLE_DIR: ${SAFENIGHT_CONTAINER_MODEL_DIR:-/app/models/random_forest}
    SAFENIGHT_WEB_DIST: /app/web
    SAFENIGHT_SENSOR_LOCATIONS_FILE: /app/var/sensor_locations.xlsx
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - runtime:/app/var
  init: true
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: safenight
      POSTGRES_USER: safenight
      POSTGRES_PASSWORD: ${SAFENIGHT_DB_PASSWORD:?Use scripts/docker-local.sh or set SAFENIGHT_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safenight -d safenight"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    ports:
      - "127.0.0.1:${SAFENIGHT_HTTP_PORT:-8001}:8000"
  scheduler:
    <<: *app
    profiles: ["collection"]
    command: ["safenight", "schedule"]
    healthcheck:
      disable: true

volumes:
  pgdata:
  runtime:
